# Entrepôt de traces (Grafana Tempo, même composition). Les flux continus (gRPC) sont coupés : Tempo est configuré avec
# `stream_over_http_enabled: false`, la recherche passe par son API HTTP.
apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    basicAuth: false
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      search:
        hide: false
      streamingEnabled:
        search: false
        metrics: false
