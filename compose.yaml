# Environnement LOCAL de développement et de test. Ne décrit pas la production (voir infra/ et docs/deploiement.md).
# Images figées par version ; aucun montage de dossier de l'hôte (les données vivent dans des volumes Docker).
name: comtaple

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:-comtaple_admin}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?définir PG_ADMIN_PASSWORD dans .env}
      POSTGRES_DB: comtaple
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d comtaple"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:8.8.4-alpine
    # Pas d'éviction : BullMQ exige que les clés de file ne soient jamais supprimées.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?définir REDIS_PASSWORD dans .env}"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 40
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Stockage objet compatible S3 pour le développement local (la cible de production est OVHcloud Object Storage).
  s3:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=20", "-master.volumeSizeLimitMB=256", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["127.0.0.1:${S3_PORT:-8333}:8333"]
    volumes: ["s3data:/data"]
    configs:
      - source: s3_identites
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    build: ./infra/keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?définir KC_ADMIN_PASSWORD dans .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?définir OIDC_CLIENT_SECRET dans .env}
      DEV_MDP_UTILISATEURS: ${DEV_MDP_UTILISATEURS:?définir DEV_MDP_UTILISATEURS dans .env}
    ports: ["127.0.0.1:${KC_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  clamav:
    image: clamav/clamav-debian:1.5.4
    ports: ["127.0.0.1:${CLAMAV_PORT:-3310}:3310"]
    volumes: ["clamdata:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s

  # OCR local des pièces (PaddleOCR). Aucun appel réseau sortant à l'exécution : modèles embarqués dans l'image.
  ocr:
    build: ./services/ocr
    image: comtaple-ocr:dev
    ports: ["127.0.0.1:${OCR_PORT:-8500}:8500"]
    environment:
      OCR_TAILLE_MAX_OCTETS: ${OCR_TAILLE_MAX_OCTETS:-26214400}
      OCR_PAGES_MAX: ${OCR_PAGES_MAX:-30}
      OCR_DELAI_REQUETE_S: ${OCR_DELAI_REQUETE_S:-300}
      OCR_FILE_ATTENTE_MAX: ${OCR_FILE_ATTENTE_MAX:-4}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8500/sante', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

configs:
  s3_identites:
    content: |
      {
        "identities": [
          {
            "name": "comtaple",
            "credentials": [{ "accessKey": "${S3_ACCESS_KEY:?définir S3_ACCESS_KEY dans .env}", "secretKey": "${S3_SECRET_KEY:?définir S3_SECRET_KEY dans .env}" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  pgdata:
  redisdata:
  s3data:
  clamdata:
