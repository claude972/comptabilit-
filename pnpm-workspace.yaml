packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - vitest@5.1.1

# Scripts d'installation explicitement autorisés (tout autre script de dépendance est ignoré).
  - "@aws-sdk/client-s3@3.1172.0"
  - "@aws-sdk/lib-storage@3.1172.0"
  - "@aws-sdk/middleware-sdk-s3@3.972.90"
  - jose@6.2.18
  - lucide-react@1.75.0
