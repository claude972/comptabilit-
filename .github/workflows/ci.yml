# Intégration continue. Toutes les étapes ont réussi pour la première fois le 2026-11-19 (run 44560095560), Firefox compris
# à partir du run 44571948858. Le diagnostic d'un échec est publié en annotations de l'exécution, lisibles sans compte
# (docs/decisions.md, D-063). Dernier résultat connu : docs/rapport-de-tests.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construction
        run: sh scripts/ci-etape.sh "Construction" sh -c 'pnpm run build'
      - name: Typage
        run: sh scripts/ci-etape.sh "Typage" sh -c 'pnpm run typecheck'
      - name: Tests unitaires
        run: sh scripts/ci-etape.sh "Tests unitaires" pnpm run test
      - name: Secrets locaux éphémères
        run: sh scripts/generer-env.sh
      # La première exécution (run 44509674342) a échoué au bout de 5 min dans une étape unique « construire et démarrer
      # tout », sans journal exploitable. Les étapes sont désormais séparées et bornées : celle qui échoue désigne
      # d'elle-même la construction ou le service en cause, et l'étape « Journaux en cas d'échec » en donne le détail.
      - name: Construction des images (Keycloak, OCR)
        run: docker compose --progress plain build
      - name: Services de base (PostgreSQL, Redis, S3, Keycloak)
        run: docker compose up -d --wait --wait-timeout 420 postgres redis s3 keycloak
      - name: Antivirus (ClamAV, téléchargement des signatures au premier démarrage)
        run: docker compose up -d --wait --wait-timeout 780 clamav
      - name: Migrations et jeu d'essai
        run: sh scripts/ci-etape.sh "Migrations et jeu d'essai" sh -c 'pnpm run db:migrate && pnpm run db:seed'
      - name: Tests d'intégration base de données (isolation, audit)
        run: sh scripts/ci-etape.sh "Tests base" pnpm --filter @comtaple/db run test:integration
      - name: Navigateur pour le rendu PDF
        run: pnpm --filter @comtaple/worker exec playwright install --with-deps chromium
      - name: API et worker
        run: |
          mkdir -p var
          node apps/api/dist/main.js > var/api.log 2>&1 &
          node apps/worker/dist/main.js > var/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/v1/sante && break; sleep 1; done
      - name: Service OCR
        run: docker compose up -d --wait --wait-timeout 300 ocr
      - name: Surveillance des sources (base réelle, HTTP injecté)
        run: sh scripts/ci-etape.sh "Tests worker" pnpm --filter @comtaple/worker run test:integration
      - name: Essais de fin de contrat sur ressources jetables (stockage objet d'essai, royaume Keycloak d'essai)
        run: sh scripts/ci-etape.sh "Tests plateforme" pnpm --filter @comtaple/plateforme run test:integration
      - name: Parcours de bout en bout
        run: sh scripts/ci-etape.sh "Parcours API" pnpm --filter @comtaple/api run test:integration
      # ── Suites navigateur (Chromium et WebKit réussies au run 44560095560 ; Firefox ajouté ensuite) ──
      - name: Navigateurs pour les parcours (Chromium, WebKit, Firefox)
        run: pnpm --filter @comtaple/web exec playwright install --with-deps chromium webkit firefox
      - name: Navigateur, API simulée (vrai Keycloak, simulateur d'API)
        run: sh scripts/ci-etape.sh "Navigateur simulé" pnpm --filter @comtaple/web run test:e2e
      - name: Application web sur la pile réelle
        run: |
          pnpm --filter @comtaple/web run build
          (cd apps/web && nohup node node_modules/next/dist/bin/next start --port 3100 > ../../var/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/connexion && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3100/connexion
      - name: Navigateur Chromium, pile réelle
        run: sh scripts/ci-etape.sh "Chromium réel" pnpm --filter @comtaple/web exec playwright test --config playwright.reel.config.ts
      - name: Navigateur WebKit, pile réelle
        run: sh scripts/ci-etape.sh "WebKit réel" pnpm --filter @comtaple/web exec playwright test --config playwright.navigateurs.config.ts --project=webkit
      # Firefox ne peut pas être lancé par l'agent sur le poste de développement (D-059) : la CI est son seul lieu d'exécution.
      - name: Navigateur Firefox, pile réelle
        run: sh scripts/ci-etape.sh "Firefox réel" pnpm --filter @comtaple/web exec playwright test --config playwright.navigateurs.config.ts --project=firefox
      # ── EXPÉRIMENTAL (D-098 bis, point 5) : isolation des analyseurs en conteneurs dédiés ──────────────────────────────
      # Jamais encore exécuté sur un exécuteur GitHub. `continue-on-error: true` : un échec n'arrête pas la CI mais reste VISIBLE
      # (étape rouge, annotation de ci-etape.sh, diagnostic ci-dessous) ; à durcir (retrait de continue-on-error) seulement après
      # plusieurs exécutions vertes. Placé en dernier des essais : un moteur Docker bloqué ne gêne aucune autre suite.
      # Pull anonyme des images officielles figées par digest (Dockerfile) et de l'image d'essai ; rien n'est poussé ni connecté.
      - name: EXPÉRIMENTALE — construction de l'image d'analyse (conteneurs dédiés)
        id: conteneur-image
        continue-on-error: true
        timeout-minutes: 15
        run: sh scripts/ci-etape.sh "Image d'analyse (experimentale)" sh -c 'docker build --target analyse -t comtaple-analyse:dev . && docker pull python:3.12.16-slim-bookworm'
      - name: EXPÉRIMENTALE — essais d'analyse en conteneurs dédiés (analyse-conteneur.itest.ts)
        id: conteneur-essais
        if: steps.conteneur-image.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        env:
          ESSAIS_CONTENEUR: '1'
        run: sh scripts/ci-etape.sh "Essais conteneurs (experimentale)" timeout --signal=KILL 660 pnpm --filter @comtaple/worker exec vitest run --config vitest.integration.config.ts src/analyse-conteneur.itest.ts
      - name: EXPÉRIMENTALE — diagnostic du moteur (conteneurs, événements, journal)
        if: always() && (steps.conteneur-image.outcome == 'failure' || steps.conteneur-essais.outcome == 'failure' || steps.conteneur-essais.outcome == 'cancelled')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          echo "::group::docker ps -a"; timeout 20 docker ps -a --no-trunc || echo "docker ps sans réponse (moteur bloqué ?)"; echo "::endgroup::"
          echo "::group::docker events (30 dernières minutes)"; timeout 30 docker events --since 30m --until 0s --filter label=comtaple.analyse || true; echo "::endgroup::"
          echo "::group::journal du moteur (dockerd)"; sudo journalctl -u docker --no-pager -n 300 || true; echo "::endgroup::"
          echo "::group::version du moteur"; timeout 20 docker version || true; echo "::endgroup::"
          restants=$(timeout 20 docker ps -a -q --filter label=comtaple.analyse | wc -l)
          echo "::warning title=EXPERIMENTALE conteneurs d'analyse::${restants} conteneur(s) d'analyse encore present(s) apres les essais (voir docs/exploitation.md paragraphe 17)"
      - name: EXPÉRIMENTALE — nettoyage des conteneurs d'analyse
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        # Seuls les conteneurs portant l'étiquette comtaple.analyse, jamais de prune ; délai dur par commande.
        run: |
          for id in $(timeout 20 docker ps -a -q --filter label=comtaple.analyse); do timeout 20 docker rm -f "$id" || echo "::warning title=EXPERIMENTALE nettoyage::conteneur $id non supprime"; done
          true
      - name: Traces des parcours navigateur en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-navigateur
          path: |
            apps/web/test-results/
            var/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Journaux en cas d'échec
        if: failure()
        # Détail complet dans le journal de l'étape ; l'essentiel (conteneurs non sains, fin des journaux) est aussi
        # publié en annotations de l'exécution, seules lisibles sans jeton. Le script n'échoue jamais.
        run: sh scripts/ci-diagnostic.sh
      - name: Description d'infrastructure
        if: always()
        uses: opentofu/setup-opentofu@v1
      - name: Validation OpenTofu
        run: cd infra/opentofu && tofu init -input=false && tofu validate
