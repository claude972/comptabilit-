# Entrepôt de traces : Grafana Tempo en mode monolithique (un seul processus, `-target=all`), stockage LOCAL dans le
# volume `tempo_donnees`. D'après la documentation officielle de Tempo 3.1 (configuration, « monolithic mode » ; exemple
# `example/docker-compose/single-binary` du dépôt grafana/tempo, étiquette v3.1.1, consultés le 2026-11-19) : le
# stockage `local` n'est pris en charge que dans ce mode, et aucun Kafka n'est nécessaire.
#
# Les valeurs TEMPO_… viennent de l'environnement du conteneur (`-config.expand-env=true`, posées par
# compose.supervision.yaml). L'expansion s'applique à TOUT le fichier, commentaires compris : ne jamais y écrire de
# signe dollar ailleurs que devant une variable définie.
#
# BORNES (Tempo n'a PAS de plafond de taille de stockage : la taille est bornée par débit d'entrée × durée de rétention) :
# - rétention : les blocs plus vieux que TEMPO_RETENTION sont supprimés (vérification toutes les 10 minutes) ;
# - débit d'entrée : TEMPO_DEBIT_OCTETS_S octets par seconde en régime continu, TEMPO_RAFALE_OCTETS en pointe ; au-delà,
#   Tempo refuse (le collecteur réessaie puis abandonne : l'application n'en voit rien).
stream_over_http_enabled: false

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# La rétention est appliquée par l'ordonnanceur et l'ouvrier de fond (tous deux dans le processus en mode monolithique).
# TEMPO_RETENTION_INTERVALLE (10m) et TEMPO_BLOCS_COMPACTES (10m) ne changent qu'ESSAI : ils permettent d'observer une suppression
# effective en quelques minutes (scripts/essai-retention-traces.sh). Ne pas les modifier en production.
backend_scheduler:
  provider:
    retention:
      interval: ${TEMPO_RETENTION_INTERVALLE}
    compaction:
      compaction:
        block_retention: ${TEMPO_RETENTION}
        compacted_block_retention: ${TEMPO_BLOCS_COMPACTES}
backend_worker:
  compaction:
    block_retention: ${TEMPO_RETENTION}
    compacted_block_retention: ${TEMPO_BLOCS_COMPACTES}

# Durée pendant laquelle le « live store » garde (et sert) les blocs complets : défaut de Tempo 3.1 = 20m (TEMPO_LIVE_STORE_DUREE).
# CONSTAT D-102 (docs/exploitation.md § 24) : en mode monolithique, les traces récentes sont servies par le live store ; ne changer
# TEMPO_LIVE_STORE_DUREE qu'après lecture de ce paragraphe (essai : scripts/essai-retention-traces.sh).
live_store:
  complete_block_timeout: ${TEMPO_LIVE_STORE_DUREE}

overrides:
  defaults:
    ingestion:
      rate_strategy: local
      rate_limit_bytes: ${TEMPO_DEBIT_OCTETS_S}
      burst_size_bytes: ${TEMPO_RAFALE_OCTETS}
    global:
      max_bytes_per_trace: 2000000
    compaction:
      block_retention: ${TEMPO_RETENTION}

# Aucun appel sortant : pas de rapport d'usage anonyme vers l'éditeur.
usage_report:
  reporting_enabled: false
